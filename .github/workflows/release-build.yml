name: Release build

# Three ways in, one outcome: the built zips are attached to the release for the tag, which is
# what the READMEs tell users to download.
#
#   * publishing a release by hand - the usual way here. It used to attach nothing: the only path
#     was `gh release create`, which runs for a pushed tag, and no tag push ever happened, so the
#     release page kept GitHub's generated source archives and nothing else.
#   * pushing a tag - `v1.6.0` or `1.6.0`; this fork has used both, so both are accepted.
#   * Actions -> Release build -> Run workflow - name the tag to fill a release that already
#     exists, which is how an empty release gets its files.
#
# GitHub attaches "Source code (zip)" and "Source code (tar.gz)" to every release itself and they
# cannot be removed. The assets listed underneath them are this workflow's, and those are the
# compiled extension.
#
# `.github/workflows/release.yml` stays upstream's release-please automation: it opens the
# version-bump PR and creates the tag and the release this workflow then fills.

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach, named as it exists (1.6.0 or v1.6.0)"
        required: true
        type: string

concurrency:
  # The tag alone, so a tag push and the release it creates share one queue instead of racing to
  # write the same assets.
  group: release-build-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A tag that disagrees with the extension manifest would ship a build whose version is not
      # the one users clicked on. Either tag style is allowed; the version is what has to match.
      - name: Check the tag against the extension version
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/extension/package.json').version")"
          name="$(node -p "require('./apps/extension/package.json').name")"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag $TAG does not match apps/extension/package.json version $version"
            exit 1
          fi
          {
            echo "PKG_NAME=$name"
            echo "PKG_VERSION=$version"
          } >> "$GITHUB_ENV"
          echo "Releasing $name $version for tag $TAG"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build and zip
        run: pnpm zip:all

      - name: Verify the zips and checksum them
        run: |
          set -euo pipefail
          cd apps/extension/.output
          for target in chrome firefox sources; do
            zip="$PKG_NAME-$PKG_VERSION-$target.zip"
            if [ ! -f "$zip" ]; then
              echo "::error::$zip is missing - the READMEs tell users to download exactly this name"
              exit 1
            fi
            printf '%s  %s\n' "$(sha256sum "$zip" | cut -d' ' -f1)" "$zip" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: apps/extension/.output
        run: |
          set -euo pipefail
          flags=()
          case "$TAG" in
            *-*) flags+=(--prerelease) ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ./*.zip SHA256SUMS.txt --clobber
          else
            # Only a pushed tag reaches this branch. Creating the release publishes it, which
            # fires this workflow once more; that run takes the branch above and rewrites the
            # same assets with --clobber. A wasted run, not a duplicate asset.
            gh release create "$TAG" ./*.zip SHA256SUMS.txt \
              --verify-tag \
              --title "Mimik RU $TAG" \
              --generate-notes \
              ${flags[@]+"${flags[@]}"}
          fi

      - name: Summary
        working-directory: apps/extension/.output
        run: |
          {
            echo "## Mimik RU $TAG"
            echo
            echo "| asset | size | sha256 |"
            echo "| --- | --- | --- |"
            for zip in ./*.zip; do
              printf '| %s | %s | `%s` |\n' \
                "$(basename "$zip")" \
                "$(du -h "$zip" | cut -f1)" \
                "$(sha256sum "$zip" | cut -d' ' -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"
